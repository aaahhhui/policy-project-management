x-worker-runtime: &worker-runtime
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "from pathlib import Path; import sys; sys.exit(0 if b'workers.' in Path('/proc/1/cmdline').read_bytes() else 1)",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - policy-files:/runtime/files
      - ./data/seed:/seed:ro
    depends_on:
      mysql:
        condition: service_healthy

  collector:
    <<: *worker-runtime
    build: ./backend
    command: python -m workers.collector
    env_file: .env
    volumes:
      - policy-files:/runtime/files
    depends_on:
      mysql:
        condition: service_healthy

  evaluator:
    <<: *worker-runtime
    build: ./backend
    command: python -m workers.evaluator
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  notifier:
    <<: *worker-runtime
    build: ./backend
    command: python -m workers.notifier
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    <<: *worker-runtime
    build: ./backend
    command: python -m workers.scheduler
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql-data:
  policy-files:
